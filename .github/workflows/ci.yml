name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:boundaries
      - run: npm run check:design
      - run: npm run check:licenses
      - run: npm run -w @tandemise/desktop typecheck

  checks:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "tandemise-ci"
          git config --global user.email "ci@tandemise.invalid"
          git config --global init.defaultBranch main
      - run: npm run check:offline

  # The design system's Storybook (packages/design): it must build, its stories
  # must typecheck, and every story must render with its play function passing
  # and no new axe violation, in light and dark. On main the built site is
  # handed to the Pages deploy below. Actions here are pinned to commit SHAs.
  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run -w @tandemise/design storybook:typecheck
      - run: npm run -w @tandemise/design storybook:build
      - name: Accessibility and interaction checks (headless Chrome)
        run: npm run -w @tandemise/design storybook:a11y
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: packages/design/storybook-static

  # Publishes the Storybook built above to GitHub Pages. Needs Pages enabled in
  # the repository settings with "GitHub Actions" as the source.
  storybook-pages:
    name: Publish Storybook
    needs: storybook
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  relay-image:
    name: Relay image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the relay image
        run: docker build -f apps/relay/Dockerfile -t relay:ci .
      - name: It starts and answers health
        run: |
          docker run -d --name relay-ci -e RELAY_HOST=0.0.0.0 -e RELAY_PUBLIC_URL=https://relay.example.com -p 8787:8787 relay:ci
          for i in $(seq 1 30); do curl -fsS localhost:8787/relay/v1/health && break; sleep 1; done
          curl -fsS localhost:8787/relay/v1/health
          docker logs relay-ci | grep -E '^Admin invite: TRI-'
          docker rm -f relay-ci
      - name: It is under 120 MB to pull (compressed)
        run: |
          size=$(docker save relay:ci | gzip -c | wc -c)
          echo "relay image, compressed: $size bytes"
          test "$size" -lt 125829120
